<!DOCTYPE html>

<style>
@font-face{font-family:'AvenirLight';src:url(../assets/avenir-light.otf) format('truetype');font-weight:300;font-style:normal;font-display:swap;}
:root{
  --oliva:#424f25;
  --salvia:#a6bf85;
  --ing-fig-shape:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='391.6%20115.3%20168.4%20168.4'%3E%3Cpath%20fill='%23000'%20d='M441.078,164.791c-42.366,42.409-61.19,92.252-42.067,111.416,19.122,19.121,69.009.297,111.416-42.11s61.19-92.252,42.067-111.373c-19.165-19.165-69.009-.297-111.416,42.067h0Z'/%3E%3C/svg%3E");
  --oliva-deep:var(--oliva-dark);                   /* descripción de las tarjetas de ingrediente */
  --salvia-veil:var(--crema-lo);                  /* franja de los valores = salvia 22% sobre crema */
  --ing-shape:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%201024.267%20982.443'%3E%3Cpath%20fill='%23000'%20d='M900.034,128.176h-.007C817.097,42.665,687.537,0,511.18,0S207.156,42.672,124.399,128.176C41.469,213.694,0,334.817,0,491.218s41.121,277.357,123.37,362.868c82.242,85.685,211.461,128.357,387.818,128.357s307.642-42.672,389.883-128.357c82.068-85.511,123.196-206.467,123.196-362.868s-41.469-277.531-124.225-363.042h-.007Z'/%3E%3C/svg%3E");
  --crema:#eae4d1;
  --cafe:#382915;
  --font-display:'Poppins',system-ui,sans-serif;
  --font-body:'Kanit','Poppins',system-ui,sans-serif;
    --font-small:'AvenirLight',system-ui,sans-serif;

  /* type scale — 1.25 step; lands on 14/17/21/27/34/50 at 1440px */
  /* Escala unificada con el resto del sitio (auditoria 2026-08-31). La del home
     era un 13-18% mas pequena, asi que el texto crecia de golpe al entrar a
     cualquier pagina interior: el cuerpo pasaba de 18px a 21px. */
  --t-xs:clamp(13px,.97vw,15px);
  --t-sm:clamp(15px,1.18vw,19px);
  --t-base:clamp(17px,1.46vw,23px);
  --t-md:clamp(20px,1.875vw,30px);
  --t-lg:clamp(24px,2.36vw,38px);
  --t-xl:clamp(30px,3.47vw,54px);

  /* motion — art-directed, never the browser default */
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-io:cubic-bezier(.65,0,.35,1);
  --ease-hover:cubic-bezier(.3,0,.2,1);

  /* optical tracking */
  --track-display:-.03em;
  --track-tight:-.02em;

    /* ===== Tokens unificados — auditoria del 2026-08-31 =====
       Antes cada pagina definia los suyos. Los tres fallos que corrige:
       - --content-max no existia en el About, asi que su contenedor crecia sin
         tope (1920px de ancho en un monitor de 1920, contra 1180 del home);
       - --pad-x se cruzaba entre home y About segun el ancho de ventana, asi que
         el contenido se movia de sitio al navegar, y en direccion distinta segun
         el tamano de la pantalla;
       - el ritmo vertical iba en vh en el home y el About y en vw en las otras
         dos, asi que en una ventana baja unas paginas se comprimian y otras no.
         La escala --sp-* va toda en vw. */
    --content-max:1180px;
    --pad-x:clamp(20px,5vw,72px);
    --sp-1:clamp(16px,2vw,28px);
    --sp-2:clamp(28px,4vw,52px);
    --sp-3:clamp(48px,6vw,80px);
    --sp-4:clamp(72px,9vw,120px);
    /* Derivados de marca. Sustituyen a los 20 colores sueltos que habia. */
    --oliva-dark:#354c1f;
    --crema-hi:#f3eede;
    --crema-lo:#dbdcc0;
    /* Un solo gris calido, 5,6:1 sobre blanco. Reemplaza a #8a7961 (4,21:1),
       #9a9075 (3,17:1) y #b3ab98 (2,28:1), que no pasaban el minimo AA. */
    --gris:#6f6252;
    --pin:#b0392a;


  /* one gutter for the whole page */


}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{font-family:var(--font-body)}

.track{height:250vh;position:relative}
.stage{position:sticky;top:0;height:100vh;overflow:hidden;background:var(--crema)}

/* pointer-events:none es OBLIGATORIO, no cosmetico. .zoom es el lienzo del
   intro y va en z-index:3, encima de .card (z-index:2), que es donde viven
   los botones del hero. Terminado el intro se queda con opacidad 0 — pero
   opacidad 0 NO desactiva los clics, asi que seguia tragandoselos todos y
   ni «Request a FREE sample» ni «Explore our ingredients» hacian nada.
   .mark ya lo llevaba; esto se habia quedado sin poner. */
.zoom{position:absolute;inset:0;z-index:3;pointer-events:none}
.zoom svg{width:100%;height:100%;display:block}

.card{position:absolute;inset:0;background:var(--oliva);overflow:hidden;opacity:0;z-index:2;
  display:flex;flex-direction:column;justify-content:center;will-change:opacity,clip-path}
.mark{position:absolute;top:9%;left:50%;transform:translateX(-50%);
  font-family:var(--font-display);font-weight:500;font-size:min(15vw,220px);
  color:rgba(166,191,133,.13);letter-spacing:-.03em;white-space:nowrap;line-height:1;
  pointer-events:none}
.card-in{position:relative;z-index:2;padding:0 var(--pad-x);width:100%;
  max-width:calc(var(--content-max) + var(--pad-x)*2);margin:0 auto;
  display:flex;align-items:flex-end;gap:clamp(20px,2.2vw,32px);justify-content:space-between}
/* 650 = lo que mide el titular a 52px (636) + aire. Más ancho sólo agranda el
   hueco del centro, porque el texto no lo llena.
   Alineado abajo y no centrado: el bloque pesa hacia el pie del verde, como en la
   referencia. El padding lo despega del borde. */
.hero-copy{flex:1 1 auto;max-width:650px;padding-bottom:clamp(20px,2.812vw,52px)}
/* El ancho sale del alto: la O mide exactamente lo mismo que el verde visible, y su
   borde derecho cae en el gutter porque .media es el último ítem de .card-in. */
.media{flex:0 0 auto;width:auto;display:flex;align-items:center;justify-content:flex-end}
.lens{position:relative;height:var(--o-h,480px);width:auto;aspect-ratio:1472.597/1412.534}
.lens canvas,.lens svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.lens svg{pointer-events:none}
.lens .cls-2{fill:#ebe5d0}

/* Versalita chica dentro de una cápsula, no titular secundario: a 29px en peso 700
   le robaba la atención al h1 (66% de su tamaño y más grueso). El marco le devuelve
   presencia sin que vuelva a competir por tamaño. */
.eyebrow{display:inline-block;font-family:var(--font-body);font-weight:400;font-size:var(--t-xs);
  text-transform:uppercase;letter-spacing:.18em;
  color:var(--salvia);margin:0 0 22px;
  padding:9px 20px;border-radius:999px;
  background:rgba(234,228,209,.09);border:1px solid rgba(234,228,209,.22)}
/* Peso 500 y token, como el h1 de las otras tres paginas: iba en 400 y el home
   se veia mas debil sin que hubiera una razon detras (auditoria 2026-08-31). */
h1{font-family:var(--font-display);font-weight:500;font-size:var(--t-xl);
  letter-spacing:var(--track-display);
  line-height:1.12;color:var(--crema);margin:0 0 20px}
.sub{font-family:var(--font-body);font-weight:400;font-size:var(--t-base);
  color:var(--crema);margin:0 0 28px;max-width:60ch;line-height:1.6}
.ctas{display:flex;gap:16px;flex-wrap:wrap}
.btn{font-family:var(--font-display);font-weight:500;font-size:var(--t-base);
  background:var(--crema);color:var(--cafe);border-radius:999px;
  padding:.62em 1.5em;text-decoration:none;display:inline-block;
  transition:transform .18s var(--ease-hover)}
.btn b{font-weight:700}
.btn:hover{transform:translateY(-2px)}

/* La banda va sobre una franja de color a sangre completa. Sin ella flotaba sobre
   el mismo crema que es el fondo de la sección siguiente, y no se sabía dónde
   terminaba el hero.
   La franja se pinta con un ::before que se desborda a los lados: las columnas de
   la banda están alineadas al pixel con el titular (x=130) y con la O (x=1310), así
   que mover su caja rompería esa alineación. El pseudo pinta el fondo sin tocarlas.
   Se ancla bajo el verde, no al pie del stage: --extra ya no se usa para subirla. */
/* La tarjeta de valores NACE DETRÁS de la tarjeta verde y sale por abajo.
   Arranca justo donde el verde termina, así que se leen como una sola pieza. */
.band{position:absolute;left:0;right:0;top:calc(38px + var(--o-h,478px));
  bottom:auto;z-index:1;opacity:0;
  max-width:calc(var(--content-max) + var(--pad-x)*2);margin:0 auto;
  padding:clamp(30px,3vw,56px) var(--pad-x);
  display:grid;grid-template-columns:repeat(4,1fr);gap:0;
  will-change:opacity,transform}
/* La superficie se dibuja con un ::before porque las columnas de la banda están
   alineadas al pixel con el titular (x=130) y con la O (x=1310): mover la caja de
   la banda rompería esa alineación.
   - izquierda/derecha: hasta los bordes EXACTOS de la tarjeta verde (38px), no
     los de la ventana.
   - top:-40px: nace detrás del verde, así las esquinas redondeadas del verde
     apoyan sobre esta superficie y no sobre el crema. Ese trozo queda tapado
     porque el verde va en z-index 2 y la banda en 1.
   - radio sólo abajo: arriba se funde con el verde. */
.band::before{content:'';position:absolute;z-index:-1;top:-40px;bottom:0;
  left:calc(-1 * max(0px, (100vw - 100%)/2 - 38px));
  right:calc(-1 * max(0px, (100vw - 100%)/2 - 38px));
  background:var(--salvia-veil);border-radius:0 0 28px 28px}
/* Bajo 920px la O se oculta y --o-h queda en `auto`: eso invalida el calc() del
   top y la banda se iría al borde superior del stage, detrás del verde.
   Ahí se ancla al pie, como antes. */
@media (max-width:920px){
  .band{top:auto;bottom:calc(var(--extra,0px) / 2)}
  /* La bajada crece sólo en escritorio: en móvil la banda ya venía apretada de
     antes (dos filas casi tocándose) y a 18px las filas se solapan. Pendiente. */
  .band p{font-size:clamp(13px,1.04vw,17px)}
}
/* values — editorial: no boxes, hairline dividers, headline-scale type */
.band{grid-template-rows:auto auto}
/* 24px, no 32: con el contenedor a 1180 "Direct & personal" se partía por 5px */
.band>div{padding:0 clamp(12px,1.6vw,24px);border-left:1px solid rgba(56,41,21,.18);
  display:grid;grid-row:span 2;grid-template-rows:subgrid;align-content:start}
@supports not (grid-template-rows:subgrid){
  .band>div{display:block}
  .band h2{min-height:2.16em}   /* reserve two lines so descriptions still align */
}
.band>div:first-child{padding-left:0;border-left:0}
.band>div:last-child{padding-right:0}
/* Tamanos congelados de la escala anterior, a peticion de Michelle (2026-08-31).
   La banda esta calibrada a ojo contra el hero del que sale; con la escala nueva
   el titulo pasaba de 28,9 a 34px y el texto de 18 a 21, y se comia el equilibrio. */
.band h2{font-family:var(--font-display);font-weight:500;font-size:clamp(22px,2.01vw,33px);
  letter-spacing:var(--track-display);line-height:1.08;
  color:var(--oliva);margin:0 0 6px;text-wrap:balance}
/* Sin opacidad y un escalón más grande: la bajada era gris y pequeña al lado del
   título. A plomo, var(--cafe) sobre la franja da 8.9:1. */
.band p{font-family:var(--font-body);font-weight:400;font-size:clamp(15px,1.25vw,20px);
  color:var(--cafe);margin:0;line-height:1.5;max-width:24ch}

/* ===== Our most requested ingredients — moving carousel ===== */
/* ===== Our most requested ingredients — carril arrastrable ===== */
/* Ritmo vertical en la escala --sp-*, toda en vw (auditoria 2026-08-31).
   Antes el home y el About separaban secciones con vh y el portafolio y el
   Contact con vw: en una ventana baja unas paginas se comprimian y otras no. */
/* sp-2 arriba y no sp-3: entre la banda de valores y este titulo habia 147px y
   se leia como un corte. Con esto y los 35px menos de cola del hero quedan 78. */
.ingredients{background:var(--crema);padding:var(--sp-2) 0 var(--sp-1);overflow:hidden}
/* El título crece al entrar: --tsc lo escribe el JS en cada frame de scroll. */
.ing-title{font-family:var(--font-display);font-weight:400;font-size:var(--t-xl);letter-spacing:var(--track-display);
  color:var(--cafe);text-align:center;margin:0 0 20px;line-height:1.1;padding:0 var(--pad-x);
  transform:scale(var(--tsc,1));transform-origin:50% 50%;will-change:transform}
.ing-sub{font-family:var(--font-body);font-weight:300;font-size:var(--t-base);
/* Ritmo tomado de la referencia de Michelle y redondeado a la retícula de 4px:
   título -> subtítulo 26px, subtítulo -> iconos 68px. El segundo hueco tiene que
   ser claramente mayor que el primero, o el subtítulo se lee pegado a las tarjetas. */
  color:var(--oliva);text-align:center;margin:0 0 clamp(36px,3.188vw,46px);padding:0 var(--pad-x)}
/* El hueco real hasta el verde no es sólo este margen: el carril mete 8px y la
   tarjeta otros 36 de relleno invisible (es más grande que el círculo para que la
   foto pueda crecer en hover). Los tres suman, por eso se sentía tan lejos. */

/* El carril es un scroller nativo con la barra oculta: rueda, trackpad, teclado y
   arrastre funcionan de fábrica. El auto-scroll escribe scrollLeft (NO un transform)
   justamente para que el arrastre y la animación no se peleen por la misma propiedad. */
.ing-carousel{margin-top:-48px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;
  overscroll-behavior-x:contain;cursor:grab;-webkit-tap-highlight-color:transparent}
.ing-carousel::-webkit-scrollbar{width:0;height:0;display:none}
.ing-carousel.is-drag{cursor:grabbing;user-select:none;-webkit-user-select:none}
.ing-carousel:focus-visible{outline:2px solid var(--cafe);outline-offset:-2px}
/* Aire vertical para el anillo de foco; la foto ya cabe dentro del slot. */
/* 56px arriba y abajo para el sobrante de la foto centrada. El de arriba se cancela
   con el margen negativo del carril: el recorte de overflow-y sigue 48px mas alto,
   asi que la foto cabe, pero visualmente las tarjetas no se alejan del subtitulo. */
.ing-track{display:flex;width:max-content;padding:56px 0}

/* Sin marco la tarjeta ya no tiene que ser cuadrada ni tan ancha: sólo tiene que
   caber el bloque de texto y la foto del hover. Más estrecha y más baja = las
   tarjetas quedan más cerca entre sí y más cerca del título. */
.ing{position:relative;flex:0 0 auto;width:clamp(240px,23vw,318px);aspect-ratio:318/250;
  margin-right:clamp(4px,0.42vw,6px);cursor:pointer;outline:none;z-index:1}
.ing:hover,.ing:focus-within{z-index:4}

/* Sin marco: la única forma en reposo es la figurita sobre el título — la 'o'
   inclinada del logo, rellena con la foto del ingrediente. Va como máscara para que
   la foto herede el contorno sin recortes extra.
   Medidas del SVG de Michelle: lado 18.07% del ancho de la tarjeta, y su caja es
   cuadrada (168.4 x 168.4). El fondo va al 140% para entrar en la textura del montón
   en vez de mostrarle los bordes. */
/* 18.07% del SLOT, no de la caja de texto: .ing-info lleva 10.3% de padding y un
   porcentaje aquí se mediría contra la caja ya recortada (salía 52px en vez de 65). */
.ing-fig{width:clamp(47.7px,4.699vw,65.05px);aspect-ratio:1;margin:0 auto clamp(5.4px,0.534vw,7.4px);
  /* 240%, no 140%: la 'o' está INCLINADA, así que su contorno llega hasta las
     esquinas de su caja — a 46px del centro en una figura de 65px. El montón a
     140% sólo cubría 41px de radio y por eso asomaba el fondo crema en las puntas.
     A 240% el radio del montón pasa de 64px y la figura queda sólo con textura. */
  /* El zoom es 240% por defecto pero se puede subir por ingrediente con
     --fig-zoom. Medido sobre el pixel: en ing-magnesium-oxide.jpg la ventana
     centrada a 240% atrapa una mancha de luminancia 10 —negra— en el borde del
     monton, que sobre un polvo BLANCO canta muchisimo. A 300% la ventana es mas
     pequena, la mancha queda fuera y el pixel mas oscuro sube a 110 (gris medio,
     invisible a 65px). El resto se quedan en 240%: el cacao sale "oscuro" al
     medirlo pero es que el cacao ES marron, ahi no hay nada que arreglar. */
  background:var(--photo) center/var(--fig-zoom,240%) no-repeat;
  /* --fig-tone sólo afecta a la figurita, NUNCA a la foto grande del hover:
     los polvos blancos se disuelven en el crema a este tamaño. */
  filter:var(--fig-tone,none);
  -webkit-mask:var(--ing-fig-shape) center/100% 100% no-repeat;
          mask:var(--ing-fig-shape) center/100% 100% no-repeat}

/* La foto mide 112% de la tarjeta (356px a 1440) y va CENTRADA. Sobresale 53px por
   arriba y por abajo; ese aire lo pone el padding de .ing-track, y el de arriba se
   cancela con un margen negativo en el carril para no separarlo del subtítulo. */
.ing-media{position:absolute;top:50%;left:50%;width:112%;aspect-ratio:1;margin:0;background-repeat:no-repeat;background-position:center;
  background-size:contain;opacity:0;transform:translate(-50%,-50%) scale(.9);
  -webkit-mask:var(--mask) center/contain no-repeat;
          mask:var(--mask) center/contain no-repeat;
  /* Va DESPUES del atajo `mask`, que lo reinicia. Y es imprescindible: la mascara
     es un PNG en escala de grises, que NO tiene canal alfa, asi que por defecto
     CSS la lee como "todo opaco" y no recorta nada. Con luminance, blanco muestra
     y negro oculta. */
  -webkit-mask-source-type:luminance;
          mask-mode:luminance;
  transition:opacity .34s var(--ease-out),transform .44s var(--ease-out);
  will-change:opacity,transform;pointer-events:none}
/* La foto vive como variable en el <article>: la usan la capa grande del hover y la
   figurita del reposo, sin repetir la URL ni duplicar la descarga. */
.img-1{--photo:url(../assets/ing-collagen.jpg);--mask:url(../assets/ing-collagen-mask.png)}
.img-2{--photo:url(../assets/ing-creatine.jpg);--mask:url(../assets/ing-creatine-mask.png)}
.img-3{--photo:url(../assets/ing-cocoa.jpg);--mask:url(../assets/ing-cocoa-mask.png)}
/* Los dos magnesios se disolvían en el crema. Más brillante, no más oscuro: el
   crema es beige cálido, así que un blanco más puro se separa igual de bien y se ve
   limpio, mientras que oscurecerlos los volvía grises.
   Y no es sólo subir `brightness`: sobre un blanco casi puro eso lo quema y se
   pierde el grano. El CONTRASTE abre los blancos hacia arriba conservando las
   sombras que dibujan la textura del polvo.
   La creatina se queda como está — decisión de Michelle, 2026-08-31. */
.img-4{--photo:url(../assets/ing-magnesium-oxide.jpg);--mask:url(../assets/ing-magnesium-oxide-mask.png);
  --fig-tone:contrast(1.2) brightness(1.05) saturate(.92);
  --fig-zoom:300%}
.img-5{--photo:url(../assets/ing-magnesium-citrate.jpg);--mask:url(../assets/ing-magnesium-citrate-mask.png);
  --fig-tone:contrast(1.2) brightness(1.05) saturate(.92)}
/* El color va en JPEG y la transparencia en una máscara gris aparte: un PNG con
   alfa a este tamaño pesaba 4 MB los cinco; así son 690 KB y el recorte es real,
   la foto ya no arrastra un cuadrado de fondo. La máscara puede ir a menos
   resolución y con 16 niveles porque es una sombra suave. */
.ing-media{background-image:var(--photo)}

/* Al pasar el raton sobre una tarjeta, las dos vecinas se apartan un poco para
   dejarle sitio a la foto. :has() permite alcanzar tambien a la anterior, que con
   selectores de hermano no se podia. */
.ing:hover + .ing{--nudge:16px}
.ing:has(+ .ing:hover){--nudge:-16px}
@media (hover:none){.ing{--nudge:0px}}
.ing-info{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;text-align:center;z-index:3;
  /* Anclado arriba, no centrado: centrado dejaba 66px de aire muerto sobre la
     figurita y era lo que separaba las tarjetas del subtítulo.
     El SVG v2 da 8.06% de margen lateral, pero ahí la tarjeta era proporcionalmente
     más ancha respecto al cuerpo del título. Con la tarjeta estrechada a 318px y el
     título en el tamaño ya aprobado (22.97px), 8.06% dejaba la caja en 267px y
     "Alkalized Cocoa Powder" mide 267 clavados: se partía en dos por cero margen. */
  padding:14px 6.5% 0;
  transform:translate(var(--nudge,0px),0);
  transition:transform .38s var(--ease-out);will-change:transform}
.ing-copy{transition:opacity .28s var(--ease-out)}
/* OJO: los tres tamanos del carrusel (.ing-name, .ing-feat, .ing-explore) NO van
   por token a proposito. Son valores literales del SVG v2 que entrego Michelle,
   y cambiarlos rompe la fidelidad con su archivo de diseno. Es la unica
   excepcion consciente a la escala unica; queda pendiente su decision. */
.ing-name{font-family:var(--font-display);font-weight:500;font-size:clamp(16.84px,1.659vw,22.97px);
  letter-spacing:var(--track-tight);text-wrap:balance;

   --ex-shift = (alto de la copia + su margen) / 2, medido por tarjeta en el JS:
   la copia ocupa 1 o 2 líneas según el producto, así que no puede ser un número fijo. */
/* :focus-visible y no :focus-within. La tarjeta lleva tabindex, asi que un CLIC
   la enfocaba y el ingrediente se quedaba abierto hasta hacer clic en otro

.ing:focus-visible .ing-media,
.ing:has(:focus-visible) .ing-media{opacity:1;transform:translate(-50%,-50%) scale(1)}
.ing:hover .ing-copy,

/* ── Hero en movil ───────────────────────────────────────────────────────────
   La "O" vuelve, pequena y arriba a la derecha, junto al rotulo. Va en absoluto
   porque .media y .eyebrow viven en contenedores distintos y no hay forma de
   ponerlos en la misma fila solo con flex. El rotulo se estrecha para que caiga
   en dos lineas y no pase por debajo de la O. */
@media (max-width:720px){
  /* ── UN SOLO margen para toda la pagina ──────────────────────────────────
     Medido antes de tocar: el hero entraba a 32, la banda de valores y «Why
     buyers» a 20, y los titulos del carrusel a 0 con su propio relleno. Tres
     ejes distintos, asi que nada se alineaba al bajar — eso es lo que se veia
     torcido. 24 es el valor de nutritionformulators.com y cae justo entre los
     dos nuestros. */
  :root{--pad-x:24px}
  .card-in{display:block;position:relative;padding-left:24px;padding-right:24px}
  /* right:var(--pad-x) y no 0: con 0 la O llegaba al borde de la PANTALLA
     (x=375) mientras el texto para en 343, asi que la esquina redondeada de la
     tarjeta se la comia. Ahora su borde derecho cae en la misma linea que el
     texto. */

     ahi vale 20 y dejaba la O doce pixeles fuera del texto. Con esto su borde
     derecho cae exactamente en la misma linea que el titular (343). */
  .media{display:flex;position:absolute;top:0;right:24px;height:80px;width:auto;
    z-index:3;pointer-events:none}
  .lens{height:100%;width:auto}
  /* `.eyebrow .corte-movil` y no `.corte-movil` a secas: la regla que lo oculta
     va mas abajo en la hoja, y a igual especificidad gana la ultima. */
  .eyebrow .corte-movil{display:inline}
  /* Ritmo del hero. Antes era 18 / 20 / 28: los dos primeros casi iguales, asi
     que el rotulo se leia pegado al titular y no como lo que es, una etiqueta.
     Ahora 24 / 14 / 32 — la etiqueta se separa, el titular y su descripcion se
     juntan porque son una sola idea, y antes de los botones hay un corte claro. */
  /* El rotulo y la O son UN marco, no dos piezas sueltas: la pildora ocupa
     todo el ancho del texto y la O se apoya en su extremo derecho. El relleno
     de la derecha reserva su sitio para que las palabras no pasen por debajo. */
  /* El rotulo crece hasta el alto de la O para que sean UNA pieza: la O ya no
     sobresale del marco, se apoya dentro. 80px es el alto de dos lineas de
     rotulo con aire, y la O se iguala a ese numero. */
  .eyebrow{display:flex;align-items:center;width:100%;max-width:none;
    min-height:80px;padding-top:0;padding-bottom:0;
    padding-right:104px;margin-bottom:18px}
  /* Hero centrado: con un solo boton la columna pide eje central. El titular
     sube (20 en vez de 24) para quedar mas cerca de su marco. */
  .hero-copy{text-align:center}
  /* El <br> viene del escritorio, donde parte la frase en dos lineas limpias.
     Centrado y en 375px dejaba «supply.» sola en su renglon. Se anula y se deja
     que el navegador reparta: text-wrap:balance iguala el largo de las lineas y
     evita huerfanas. */
  .hero-copy h1 br{display:none}
  /* Interlineado 1.3 y no 1.13: a 30px en un telefono, 34 dejaba las tres
     lineas amontonadas. La referencia usa 40 sobre 30 — ese aire es la mitad
     de por que se lee mejor que la nuestra. */
  .hero-copy h1{margin-bottom:20px;line-height:1.3;text-wrap:balance}
  /* La descripcion tambien se equilibra: tres lineas centradas y desflecadas
     eran justo lo que se veia raro. */
  .hero-copy .sub{text-wrap:balance}
  .hero-copy .sub{margin-bottom:28px}
  /* El rotulo mantiene su texto a la izquierda: centrarlo dentro de una pildora
     con 104px de reserva a la derecha lo dejaria descolocado. */
  .eyebrow{text-align:left}
  /* «Explore our ingredients» se va del hero en movil: el catalogo esta en el
     menu de Wix y en cada tarjeta del carrusel de abajo. Con un solo boton la
     accion principal deja de competir consigo misma. */
  .ctas .btn:last-child{display:none}
  /* Y el que queda pasa al verde salvia de la marca: sobre el oliva del hero
     resalta mucho mas que el crema, que se confunde con la tarjeta de valores
     que viene justo debajo. */
  .ctas .btn{background:var(--salvia);color:var(--cafe)}
  /* La banda respira menos: 30px arriba y abajo eran 60 de los 277 que mide,
     y en un telefono ese aire retrasa la seccion siguiente sin aportar nada. */
  .band{padding-top:20px;padding-bottom:20px}

  /* ── Carrusel de ingredientes ─────────────────────────────────────────────
     Sin «Explore» por tarjeta y sin el movimiento de hover: en un telefono no
     hay raton que lo dispare, y el boton multiplicaba los objetivos pulsables
     sin llevar a ningun sitio distinto — los cinco iban al mismo catalogo.
     En su lugar, un solo enlace debajo del subtitulo. */
  /* Este titulo y el del hero miden los dos 30px y estaban a x1,10 y x1,30. */
  .ing-title{line-height:1.3}
  .why-title{line-height:1.3}
  .ing-explore{display:none}
  .ing:hover .ing-media,
  .ing:hover .ing-copy,
  .ing:hover .ing-info,
  .ing:has(:focus-visible) .ing-info{transform:none}
  .ing:hover + .ing,
  .ing:has(+ .ing:hover){--nudge:0px}
  /* `.ing-sub .ing-todos` y no la clase sola: la regla que lo oculta va mas
     abajo en la hoja y a igual especificidad ganaria ella. Es la segunda vez
     que pasa en este bloque — cualquier cosa que se muestre SOLO en movil
     necesita un selector mas especifico que el que la oculta. */
  .ing-sub .ing-todos{display:inline-block;margin-top:10px;
    font-family:var(--font-body);font-weight:400;font-size:var(--t-sm);
    color:var(--oliva);text-decoration:underline;text-underline-offset:4px}
  /* Botones centrados y a lo ancho: en un telefono el objetivo pulsable
     importa mas que la alineacion a la izquierda. */
  .ctas{justify-content:center}
  .ctas .btn{flex:1 1 100%;text-align:center}
  /* Los valores dejan de compartir reticula: con subgrid la fila del titulo
     medía lo que el titulo MAS ALTO, asi que los de una linea arrastraban un
     renglon vacio antes de su descripcion. */
  .band>div{grid-row:auto;grid-template-rows:none;display:block}
  /* 19px y no 22: a 22 los valores pesaban mas que la descripcion del hero (17).
     Interlineado x1,3 porque en columnas de 164px casi todos parten en dos
     lineas y a x1,09 quedaban pegadas. */
  .band h2{min-height:0;margin-bottom:6px;font-size:19px;line-height:1.3}
}

/* ===== intro: CSS default IS the final state =====
   Nothing here depends on JS to become visible. The start state is applied only
   under html.intro-armed, which the head script adds solely when the intro will
   actually run. If JS fails, the composed hero is what renders. */
html:not(.intro-armed) .track{height:100vh}
/* Terminado el intro el track vuelve a 100vh: los 150vh de recorrido ya se usaron
   y dejarlos hace que el hero se quede clavado 1350px, sobre todo al volver hacia
   arriba. El JS descuenta esa misma distancia del scroll para que no salte. */
html.intro-collapsed .track{height:100vh}
/* Reproduccion automatica: el track nunca crece a 250vh, porque ya no hace falta
   recorrido de scroll. Se pone desde el <head>, antes del primer pintado, para
   que no asome una barra de scroll de 2,5 pantallas durante unos frames. */
html.intro-auto .track{height:100vh}
.zoom{opacity:0}
.mark{opacity:0}
.card{opacity:1}
.band{opacity:1;transform:none}
/* NOTE: .zoom and .mark are deliberately NOT revealed by CSS. Revealing them on
   html.intro-armed painted the logo before boot() had decided which frame we are
   on — on a back-navigation the browser restores the scroll, so the logo appeared
   and was instantly snapped away. applyFrame() reveals them instead. */
html.intro-armed .card{opacity:0}
html.intro-armed .band{opacity:0}
html.intro-armed .band>div{opacity:0}   /* sin esto parpadean antes del primer frame */
.why-card{clip-path:none}

<script>
/* Decide before first paint whether the intro will run. If it will not, no class
   is added and the CSS defaults (= the composed hero) stand. Content is never
   invisible because of JS. */
(function(){
  try{
    // ?intro=1 lo obliga a repetirse: si no, corre una sola vez por sesion y
    // revisarlo obliga a abrir pestaña nueva cada vez.
    if(/[?&]intro=1\b/.test(location.search)) sessionStorage.removeItem('tc_intro_done');
    var done = sessionStorage.getItem('tc_intro_done') === '1';
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    // Por defecto el intro se reproduce SOLO al cargar. Guiarlo por scroll no
    // sobrevive dentro de un iframe de Wix: el scroll de la pagina padre no
    // llega al embed (medido el 2026-08-22) y el track de 250vh obligaria a una
    // barra de scroll interna. Con ?driver=scroll vuelve el comportamiento
    // anterior, para poder comparar los dos.
    var porScroll = /[?&]driver=scroll\b/.test(location.search);
    // El intro SI se reproduce en movil: es el unico motion que se conserva
    // ahi (Michelle, 2026-09-03). Los otros dos —el titulo que crece y el
    // despliegue verde— se apagan, porque en un telefono estorban mas de lo que
    // aportan y retrasan la lectura.
    if(!done && !reduce){
      document.documentElement.className += ' intro-armed';
      if(!porScroll) document.documentElement.className += ' intro-auto';
    }
  }catch(e){ document.documentElement.className += ' intro-armed intro-auto'; }
})();
</script>
