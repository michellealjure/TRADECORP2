  :root{
    --oliva:#424f25;
    --salvia:#a6bf85;
    --crema:#eae4d1;
    --cafe:#382915;
    --font-display:'Poppins',system-ui,sans-serif;
    --font-body:'Kanit','Poppins',system-ui,sans-serif;
    --font-small:'AvenirLight',system-ui,sans-serif;

    /* type scale — 1.25 step; lands on 14/17/21/27/34/50 at 1440px */
    --t-xs:clamp(13px,.97vw,15px);
    --t-sm:clamp(15px,1.18vw,19px);
    --t-base:clamp(17px,1.46vw,23px);
    --t-md:clamp(20px,1.875vw,30px);
    --t-lg:clamp(24px,2.36vw,38px);
    --t-xl:clamp(30px,3.47vw,54px);

    /* motion — art-directed, never the browser default */
    --ease-out:cubic-bezier(.16,1,.3,1);
    --ease-io:cubic-bezier(.65,0,.35,1);
    --ease-hover:cubic-bezier(.3,0,.2,1);

    /* optical tracking */
    --track-display:-.03em;
    --track-tight:-.02em;

    /* ===== Tokens unificados — auditoria del 2026-08-31 =====
       Antes cada pagina definia los suyos. Los tres fallos que corrige:
       - --content-max no existia en el About, asi que su contenedor crecia sin
         tope (1920px de ancho en un monitor de 1920, contra 1180 del home);
       - --pad-x se cruzaba entre home y About segun el ancho de ventana, asi que
         el contenido se movia de sitio al navegar, y en direccion distinta segun
         el tamano de la pantalla;
       - el ritmo vertical iba en vh en el home y el About y en vw en las otras
         dos, asi que en una ventana baja unas paginas se comprimian y otras no.
         La escala --sp-* va toda en vw. */
    --content-max:1180px;
    --pad-x:clamp(20px,5vw,72px);
    --sp-1:clamp(16px,2vw,28px);
    --sp-2:clamp(28px,4vw,52px);
    --sp-3:clamp(48px,6vw,80px);
    --sp-4:clamp(72px,9vw,120px);
    /* Derivados de marca. Sustituyen a los 20 colores sueltos que habia. */
    --oliva-dark:#354c1f;
    --crema-hi:#f3eede;
    --crema-lo:#dbdcc0;
    /* Un solo gris calido, 5,6:1 sobre blanco. Reemplaza a #8a7961 (4,21:1),
       #9a9075 (3,17:1) y #b3ab98 (2,28:1), que no pasaban el minimo AA. */
    --gris:#6f6252;
    --pin:#b0392a;

  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{background:transparent;margin:0}
  body{font-family:var(--font-body);color:var(--cafe);-webkit-font-smoothing:antialiased}

  .section{background:var(--crema);padding:var(--sp-3) 0}
  .container{max-width:1200px;margin:0 auto;padding-inline:clamp(20px,5vw,48px)}

  /* ── Header ── */
  .eyebrow{
    font-family:var(--font-display);font-weight:500;
    font-size:var(--t-xs);letter-spacing:.16em;color:var(--oliva);
    margin:0 0 8px;text-transform:uppercase;
  }
  .title{
    font-family:var(--font-display);font-weight:400;
    letter-spacing:var(--track-display);font-size:var(--t-xl);line-height:1.1;color:var(--cafe);
    margin:0 0 clamp(24px,3.5vw,40px);
  }

  /* ── Filter bar ── */
  .filter-bar{
    display:flex;align-items:center;justify-content:space-between;
    gap:clamp(16px,2.5vw,28px);flex-wrap:wrap;
  }
  .search{position:relative;flex:1 1 280px;max-width:360px;min-width:220px}
  .search svg{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;color:var(--oliva);pointer-events:none;
  }
  .search input{
    width:100%;font-family:var(--font-body);font-weight:400;
    font-size:var(--t-sm);color:var(--cafe);
    background:#fff;border:1px solid var(--salvia);border-radius:999px;
    padding:12px 16px 12px 44px;outline:none;
  }
  .search input::placeholder{color:var(--gris)}
  .search input:focus-visible{outline:2px solid var(--oliva);outline-offset:2px}

  .pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
  .pill{
    font-family:var(--font-display);font-weight:500;
    font-size:var(--t-xs);line-height:1;
    padding:.6em 1.05em;border-radius:999px;cursor:pointer;
    background:transparent;border:1px solid var(--salvia);color:var(--cafe);
    transition:background-color .15s var(--ease-hover),color .15s var(--ease-hover);
  }
  .pill[aria-pressed="true"]{background:var(--oliva);border-color:var(--oliva);color:var(--crema)}
  .pill:focus-visible{outline:2px solid var(--oliva);outline-offset:2px}

  .counter{
    font-family:var(--font-small);font-weight:400;
    font-size:var(--t-sm);color:var(--oliva);
    margin:clamp(20px,2.4vw,24px) 0 clamp(20px,2.6vw,28px);
  }

  /* ── Grid ── */
  .grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:20px;
    align-items:stretch;
  }
  .card{
    display:flex;flex-direction:column;min-width:0;
    background:#fff;border:1px solid rgba(166,191,133,.55);border-radius:14px;
    overflow:hidden;
    box-shadow:0 4px 18px rgba(56,41,21,.05);
    animation:cardIn 200ms var(--ease-out) both;

<style id="pf-preview">
/* ===== Tarjeta de portafolio — medidas tomadas del SVG de Michelle =====
   Todo va en `cqw` (1cqw = 1% del ancho de la tarjeta), así las proporciones del SVG
   se mantienen sea cual sea el ancho de la columna. El SVG mide 651.236 de ancho:
   cada medida suya se divide por eso y se multiplica por 100.
   La tarjeta es de FLUJO, no de posiciones fijas: los productos tienen entre 0 y 3
   variantes y nombres de largos muy distintos, y un calco absoluto se rompería. */
/* El maximo de 340px es el que arregla la jerarquia invertida (auditoria
   2026-08-31). Toda la tarjeta se dimensiona en cqw — porcentaje de SU ancho —
   y eso esta bien: la hace una pieza proporcional. El problema era que sin tope
   la tarjeta llegaba a 504px en una sola columna, y entonces el nombre del
   producto salia a 40px contra los 30px del titulo de la pagina.
   Con el tope, el nombre nunca pasa de 27px y el titular siempre gana.
   `auto-fill` cuenta columnas con el minimo (300), asi que el numero de columnas
   no cambia; solo deja de estirar las tarjetas. */
.grid{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,340px));
  justify-content:center;
  gap:clamp(18px,2vw,28px);grid-auto-rows:1fr}
/* `grid-auto-rows:1fr` iguala TODAS las filas, no solo las tarjetas de una misma
   fila entre si. Sin esto, una fila de productos con 3 variantes quedaba mas alta
   que otra de productos con 1, y las tarjetas se veian de tamanos distintos. */
/* Sin `align-items:start`: las tarjetas se estiran a la altura de su fila y el
   bloque de foto se pega abajo con margin-top:auto. Así las fotos de una misma
   fila quedan alineadas aunque unos productos tengan 3 variantes y otros ninguna. */
/* OJO: `cqw` mide la CAJA DE CONTENIDO del contenedor, no su caja externa. Si la
   tarjeta llevara su propio relleno, ese relleno saldría del ancho de referencia y
   todas las medidas se encogerían. Por eso el relleno vive en .pf-in y la tarjeta
   sólo define el contenedor. Y sus propias medidas no pueden ir en cqw —
   una caja no puede medirse contra sí misma. */
.pf-card{container-type:inline-size;
  background:#fff;border-radius:10px;overflow:hidden;
  box-shadow:0 1px 2px rgba(48,34,16,.06),0 8px 28px rgba(48,34,16,.07);
  display:flex;flex-direction:column}
/* `flex:1`, NO `height:100%`: con height:100% el bloque medía la tarjeta ENTERA, pero
   en las destacadas arranca debajo de la banda, así que sobresalía por abajo esos
   mismos pixeles y el botón quedaba más bajo (y recortado). Con flex ocupa sólo lo
   que queda tras la banda, y el botón cae a la misma altura en las 40. */
.pf-in{padding:5.83cqw 8.75cqw 0;display:flex;flex-direction:column;flex:1;min-height:0}

/* fila de arriba: disponibilidad + estrella */
/* Los -3.1cqw laterales son los mismos que lleva la foto: la fila superior y la
   imagen comparten margen y todo el bloque se alinea a los mismos bordes.
   La pastilla va a la derecha, dejando libre la esquina superior izquierda. */
.pf-top{display:flex;align-items:center;justify-content:flex-end;
  margin:0 -3.1cqw;min-height:7.2cqw}
.pf-avail{display:inline-flex;align-items:center;gap:2.4cqw;
  height:7.2cqw;padding:0 3.6cqw;border-radius:999px;background:#fff;
  position:relative;
  /* Sombra muy leve: esta pastilla es identica en las 40 tarjetas, asi que no
     distingue nada y no debe competir por atencion. */
  box-shadow:0 .2cqw .8cqw rgba(48,34,16,.10);
  font-family:var(--font-body);font-weight:400;font-size:4.15cqw;color:var(--oliva-dark);
  white-space:nowrap}
/* El punto y la caja de la estrella comparten tamano: si se cambia uno sin el
   otro, dejan de estar alineados. */
.pf-card{--punto:3.5cqw}
.pf-dot{width:var(--punto);height:var(--punto);border-radius:50%;background:var(--salvia)}
/* Producto destacado: banda oliva a sangre con su nombre dentro, alineada a la
   derecha. La estrella va en una caja del ancho EXACTO del punto de "Available"
   y con el mismo margen derecho, asi que sus centros coinciden en vertical; el
   svg se dibuja mayor y desborda la caja por igual a ambos lados, sin descentrar.
   Las 36 tarjetas sin banda reciben ese mismo alto como relleno superior, o su
   contenido subiria y la retícula dejaria de alinear. */
.pf-flag{display:flex;align-items:center;justify-content:flex-end;gap:2.6cqw;
  height:5.83cqw;background:var(--oliva);color:#fff;
  /* Centro del punto contado desde el borde derecho de la tarjeta:
     5.65 (margen de la fila) + 3.6 (relleno de la pastilla) + mitad del punto.
     Se le resta la mitad del icono para que coincidan los CENTROS, no los bordes. */
  padding:0 calc(5.65cqw + 3.6cqw + var(--punto)/2 - 2.6cqw) 0 5.65cqw;
  font-family:var(--font-body);font-weight:500;font-size:3.4cqw;
  letter-spacing:.02em;white-space:nowrap}
/* La caja mide lo MISMO que el icono. Antes era mas estrecha y confiaba en que el
   navegador centrara el desbordamiento: no lo hace de forma fiable y la estrella
   quedaba 3px corrida. Ahora la alineacion la da el padding del padre. */
.pf-flag-ico{width:5.2cqw;height:5.2cqw;display:grid;place-items:center}
/* La estrella se dibuja mayor que su caja y la desborda por igual a los dos lados,
   asi que su centro sigue siendo el de la caja — y la caja mide lo mismo que el
   punto y lleva su mismo margen. De ahi que queden alineados. */
.pf-flag-ico svg{width:5.2cqw;height:5.2cqw;flex:0 0 auto;color:var(--salvia)}
/* La banda mide justo el relleno superior de .pf-in, y en las destacadas ese
   relleno se anula: la tarjeta NO crece y el contenido arranca a la misma altura
   que en las otras 36. Antes sumaba y alargaba la tarjeta. */
.pf-card--featured .pf-in{padding-top:0}

/* título + enlace de info */
/* 1er nivel. Es lo unico que se lee de lejos al escanear la rejilla.
   min-height reserva SIEMPRE dos lineas (2 x 1.11 x 8.02 = 17.81cqw), tenga el
   nombre una o dos: asi la categoria y todo lo que va debajo arrancan a la misma
   altura en las 40 tarjetas. Sin esto, la retícula se desalinea segun el largo
   del nombre. Ninguno pasa de dos lineas — el mas largo son 26 caracteres. */
.pf-name{font-family:var(--font-display);font-weight:500;font-size:8.02cqw;
  line-height:1.11;letter-spacing:var(--track-tight);color:#382915;
  margin:1.2cqw 0 0;min-height:17.81cqw;text-wrap:balance;
  /* El nombre se centra DENTRO de las dos lineas reservadas. Sin esto, los de una
     sola linea se pegaban arriba y dejaban el hueco debajo, contra la categoria. */
  display:flex;align-items:center}
/* 3er nivel. Conserva la pastilla oscura del SVG, pero DEBAJO del nombre y mas
   pequena: la posicion y el tamano hacen la jerarquia, no hace falta otro color. */
.pf-cat{align-self:flex-start;display:inline-block;margin:2.8cqw 0 0;
  height:6.4cqw;line-height:6.4cqw;padding:0 3.2cqw;border-radius:.69cqw;
  background:var(--cafe);color:var(--crema);
  font-family:var(--font-body);font-weight:400;font-size:4.15cqw;white-space:nowrap}
/* Accion secundaria: legible pero sin competir con el boton principal. */
.pf-info{align-self:flex-start;margin:3.4cqw 0 0;
  font-family:var(--font-body);font-weight:400;font-size:4.15cqw;
  color:var(--cafe);opacity:.72;text-decoration:underline;text-underline-offset:.25em;
  white-space:nowrap;transition:opacity .2s var(--ease-out)}
.pf-info:hover{opacity:1}

/* tabla de variantes: reglas finas, sin cajas */
.pf-table{margin-top:3.6cqw;border-top:1px solid rgba(48,34,16,.55)}
/* La columna del grado mide 33%, no 26.8%. REGLA PARA FUTURAS TARJETAS: el ancho
   lo manda la PALABRA MAS LARGA del catalogo, porque no se puede partir. Hoy son
   "Guggulsterones" y "Quadrangularis", 14 caracteres, que a 14px piden 98px de
   ancho; la columna da 104 utiles. Con el 26.8% anterior solo habia 67 y
   "Withanolides" (87px) ya se salia.
   Si algun dia entra un grado con una palabra mas larga, hay que volver a medirla
   —no estimarla— y ensanchar la columna, o el texto se sale de su celda. */
.pf-row{display:grid;grid-template-columns:33% 1fr auto;align-items:center;
  gap:0 2.4cqw;padding:2.6cqw 0;border-bottom:1px solid rgba(48,34,16,.55)}
.pf-row--solo{grid-template-columns:1fr auto}
.pf-row--solo .pf-desc{text-align:left}
/* La ultima regla quedaba pegada a la foto y leia como un borde de la imagen. */
.pf-row:last-child{border-bottom:0}
.pf-grade,.pf-desc{font-family:var(--font-body);font-weight:400;font-size:4.12cqw;
  line-height:1.17;color:var(--cafe)}
.pf-grade{text-align:center;padding-right:2.4cqw;
  border-right:1px solid rgba(48,34,16,.55);align-self:stretch;
  display:flex;align-items:center;justify-content:center}
.pf-spec{display:flex;align-items:center;gap:1.2cqw;color:var(--cafe);
  font-family:var(--font-body);font-weight:400;font-size:3.85cqw;line-height:1.15;
  text-decoration:none;white-space:nowrap}
.pf-spec svg{width:3.8cqw;height:3.8cqw;flex:0 0 auto}
.pf-spec:hover span{text-decoration:underline}

/* foto + botón. margin-top:auto pega el bloque al pie aunque la tabla varíe */
/* La foto CRECE con la holgura en vez de dejar hueco. Un producto sin variantes
   tiene menos texto, asi que su foto sale mas alta — la tarjeta se siente
   intencionada y no incompleta, y todas siguen midiendo lo mismo.
   `flex:1` en vez de `aspect-ratio` fijo; el min-height es la proporcion del SVG. */
.pf-shot{position:relative;margin:4.6cqw -3.1cqw 0;flex:1 1 auto;min-height:46cqw;
  background:var(--crema) center/cover no-repeat;border-radius:.9cqw;
  display:grid;place-items:end center;padding-bottom:3.4cqw}
.pf-shot--none{background:repeating-linear-gradient(135deg,var(--crema-hi) 0 8px,var(--crema) 8px 16px)}
/* ACCION PRINCIPAL — segunda en la jerarquia, sólo por detras del nombre.
   Ancho 78% de la tarjeta (el padre es la foto, 88.7%: 78/88.7 = 88%), mas alto y
   con sombra propia para despegarlo de la foto.
   SIN subrayado, a proposito: el enlace secundario "Product info" tambien va
   subrayado, y con los dos subrayados la jerarquia entre principal y secundaria
   se pierde. El relleno solido ya dice "boton"; el subrayado es lo que distingue
   al enlace. */
.pf-quote{width:88%;height:12.2cqw;border-radius:2.13cqw;background:var(--oliva);
  color:#fff;display:grid;place-items:center;
  font-family:var(--font-display);font-weight:500;font-size:6.25cqw;
  text-decoration:none;box-shadow:0 .6cqw 2.4cqw rgba(48,34,16,.28);
  transition:background-color .25s var(--ease-out),transform .25s var(--ease-out)}
.pf-quote:hover{background:var(--oliva-dark);transform:translateY(-2px)}

@media (max-width:520px){
  .grid{grid-template-columns:1fr}
}
</style>

(function(){
  var grid = document.querySelector('.grid');
  if(!grid) return;

  function fila(txt, val){
    return val ? '<dt>'+txt+'</dt><dd>'+val+'</dd>' : '';
  }

  function contenido(nombre){
    var d = SPECS[nombre];
    if(!d){
      // Sin ficha: descripcion del material. Es lo unico honesto que se puede
      // poner — inventar una tabla de especificacion seria peor que no tenerla.
      var t = DESC[nombre];
      return (t ? '<p class="pf-desc-larga">'+t+'</p>' : '')
           + '<p class="pf-panel-nota">Full technical data sheet available on '
           + 'request. <a href="../contact/_prev.html">Get in touch</a> and we&rsquo;ll '
           + 'send it with the batch documentation.</p>';
    }
    // El binomio en cursiva, pero solo si existe. Antes iba
    // '<i>'+(d.botanico||'')+'</i>'.replace(...) y el .replace se aplicaba SOLO a
    // '</i>' por precedencia, asi que sin dato quedaba '<i></i>' — que no es
    // cadena vacia y pintaba una fila en blanco.
    var bot = d.botanico ? '<i>'+d.botanico+'</i>' : null;
    var ident = fila('Botanical name', bot)
              + fila('Plant part', d.parte)
              + fila('Category', d.categoria);
    var fis   = fila('Appearance', d.descripcion)
              + fila('Particle size', d.malla)
              + fila('Water solubility', d.solubilidad)
              + fila('Bulk density', d.densidad)
              + fila('Loss on drying', d.secado)
              + fila('Ash content', d.cenizas);
    var cum   = fila('Heavy metals', d.metales)
              + fila('Pesticides', d.pesticidas)
              + fila('Residual solvents', d.disolventes);
    var bloques = '';
    if(ident) bloques += '<div class="pf-grp"><h4>Identity</h4><dl>'+ident+'</dl></div>';
    if(fis)   bloques += '<div class="pf-grp"><h4>Physical specification</h4><dl>'+fis+'</dl></div>';
    if(cum)   bloques += '<div class="pf-grp"><h4>Compliance</h4><dl>'+cum+'</dl></div>';
    return '<div class="pf-cols">'+bloques+'</div>'
         + '<p class="pf-panel-nota">Product specification. The batch certificate '
         + 'of analysis is supplied with your order.</p>';
  }

  function columnas(){
    return getComputedStyle(grid).gridTemplateColumns.split(' ').filter(Boolean).length;
  }

  var abierto = null;   // {panel, scrim, enlace}

  function cerrar(){
    if(!abierto) return;
    var a = abierto; abierto = null;
    a.enlace.setAttribute('aria-expanded','false');
    a.panel.classList.remove('abierto');
    a.scrim.classList.remove('abierto');
    // se retiran al terminar la transicion, no antes
    setTimeout(function(){
      if(a.panel.parentNode) a.panel.parentNode.removeChild(a.panel);
      if(a.scrim.parentNode) a.scrim.parentNode.removeChild(a.scrim);
    }, 340);
  }

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') cerrar();
  });

  grid.addEventListener('click', function(ev){
    var enlace = ev.target.closest ? ev.target.closest('.pf-info') : null;
    if(!enlace) return;
    ev.preventDefault();

    var tarjeta = enlace.closest('.pf-card');
    var yaEstaba = abierto && abierto.enlace === enlace;
    cerrar();
    if(yaEstaba) return;

    var nombre = tarjeta.querySelector('.pf-name').textContent.trim();

    var scrim = document.createElement('div');
    scrim.className = 'pf-scrim';
    scrim.addEventListener('click', cerrar);

    var panel = document.createElement('div');
    panel.className = 'pf-panel';
    panel.innerHTML = '<div class="pf-panel-in">'
      + '<div class="pf-panel-top"><h3>'+nombre+'</h3>'
      + '<button type="button" class="pf-panel-x">Close</button></div>'
      + contenido(nombre) + '</div>';

    grid.appendChild(scrim);
    grid.appendChild(panel);

    // Se abre a la ALTURA de la tarjeta pulsada, para que nazca donde el ojo ya
    // esta mirando y no haya que buscarlo. Si por estar en las ultimas filas se
    // saldria por abajo de la reja, se sube lo justo para caber.
    var top = tarjeta.offsetTop;
    var alto = panel.offsetHeight;
    var limite = grid.clientHeight - alto;
    if (limite > 0 && top > limite) top = limite;
    if (top < 0) top = 0;
    panel.style.top = top + 'px';

    enlace.setAttribute('aria-expanded','true');
    abierto = {panel:panel, scrim:scrim, enlace:enlace};
    panel.querySelector('.pf-panel-x').addEventListener('click', cerrar);
    // Reflujo forzado en vez de requestAnimationFrame: rAF no corre en pestañas
    // de fondo ni en algunos contenedores, y ahi el panel se quedaba sin abrir.
    void panel.offsetHeight;
    panel.classList.add('abierto');
    scrim.classList.add('abierto');
  });

  // Al filtrar o buscar, la reja se vuelve a pintar y el panel quedaria huerfano.
  var obs = new MutationObserver(function(){
    if(abierto && !document.body.contains(abierto.enlace)) abierto = null;
  });
  obs.observe(grid, {childList:true});
})();
</script>

<style>#prev-badge{position:fixed;right:14px;bottom:14px;z-index:100;background:rgba(56,41,21,.72);color:#eae4d1;border-radius:999px;padding:7px 14px;font:500 11px/1 'Poppins',sans-serif;letter-spacing:.04em;pointer-events:none}
/* ═════ Panel de "Product info" ═════
   Se abre DEBAJO de la fila de tarjetas, a todo el ancho, empujando las filas
   siguientes. Va en el flujo del documento a proposito: un modal con
   position:fixed se ancla al IFRAME, no a la ventana, y dentro de un embed de
   Wix de varios miles de pixeles de alto se dibujaria fuera de la vista.
   `grid-row:auto/span 1` + `align-self:start` lo saca del igualado de
   grid-auto-rows:1fr, que si no lo estiraria al alto de una tarjeta. */
/* Flota sobre la reja, anclado con `absolute` a la propia reja — NO con
   `fixed`. Dentro de un iframe `fixed` se ancla al iframe entero, asi que en un
   embed de Wix de varios miles de pixeles el panel se dibujaria fuera de la
   vista. Y `scrollIntoView` tampoco vale: haria scroll DEL IFRAME, no de la
   pagina de Wix, que es la que de verdad se desplaza.
   Se abre a la altura de la tarjeta pulsada, asi que siempre nace en pantalla. */
.pf-scrim{position:absolute;inset:0;z-index:30;background:rgba(48,34,16,.22);
  opacity:0;transition:opacity .3s var(--ease-out);cursor:pointer}
.pf-scrim.abierto{opacity:1}
.pf-panel{position:absolute;left:0;right:0;z-index:40;
  opacity:0;transform:translateY(-8px) scale(.985);transform-origin:50% 0;
  transition:opacity .26s var(--ease-out),transform .32s var(--ease-out)}
.pf-panel.abierto{opacity:1;transform:none}
.pf-panel-in{background:#fff;border-radius:14px;
  box-shadow:0 2px 6px rgba(48,34,16,.10),0 22px 60px rgba(48,34,16,.22);
  padding:clamp(20px,2.4vw,32px)}
.pf-panel-top{display:flex;align-items:baseline;gap:16px;margin-bottom:20px}
.pf-panel-top h3{font-family:var(--font-display);font-weight:500;
  font-size:var(--t-md);letter-spacing:var(--track-tight);color:var(--cafe);
  margin:0;flex:1 1 auto}
.pf-panel-x{border:0;background:transparent;cursor:pointer;padding:6px;
  font-family:var(--font-body);font-size:var(--t-xs);color:var(--cafe);
  opacity:.6;text-decoration:underline}
.pf-panel-x:hover{opacity:1}
.pf-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:clamp(18px,2.4vw,36px)}
.pf-grp h4{font-family:var(--font-display);font-weight:500;font-size:var(--t-xs);
  letter-spacing:.08em;text-transform:uppercase;color:var(--oliva);
  margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid rgba(48,34,16,.18)}
.pf-grp dl{margin:0;display:grid;grid-template-columns:auto 1fr;
  gap:7px clamp(10px,1.2vw,18px);align-items:baseline}
.pf-grp dt{font-family:var(--font-small);font-size:var(--t-xs);color:var(--gris);
  white-space:nowrap}
.pf-grp dd{margin:0;font-family:var(--font-body);font-size:var(--t-xs);
  color:var(--cafe);line-height:1.4}
.pf-desc-larga{font-family:var(--font-body);font-weight:300;
  font-size:var(--t-sm);line-height:1.6;color:var(--cafe);
  margin:0;max-width:68ch}
.pf-desc-larga b{font-weight:500}
.pf-panel-nota{font-family:var(--font-body);font-size:var(--t-xs);color:var(--gris);
  margin:18px 0 0;padding-top:14px;border-top:1px solid rgba(48,34,16,.12)}
.pf-panel-nota a{color:var(--oliva)}
.pf-info[aria-expanded="true"]{opacity:1;font-weight:500}
@media (max-width:560px){.pf-cols{grid-template-columns:1fr}}
</style>
